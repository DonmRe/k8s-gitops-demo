apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo-dev
spec:
  replicas: 6
  selector:
    matchLabels:
      app: nginx-demo-dev
  template:
    metadata:
      labels:
        app: nginx-demo-dev
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo-dev-service
spec:
  selector:
    app: nginx-demo-dev
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
