apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: httpd-demo
  template:
    metadata:
      labels:
        app: httpd-demo
    spec:
      containers:
      - name: httpd
        image: httpd:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-demo-service
spec:
  selector:
    app: httpd-demo
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

